name: Payload Update Snapshot
# Metadata bump to trigger a fresh workflow commit.

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ payload-update ]
  workflow_dispatch:
    inputs:
      collection:
        description: "Payload collection (articles, categories, tags, authors, media)"
        required: false
        default: "articles"
      slug:
        description: "Article slug (for single-article update)"
        required: false
      id:
        description: "Article ID (optional)"
        required: false

concurrency:
  group: payload-snapshot-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download latest prepared snapshot (if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="prepared-snapshot"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p prepared-articles.json -D .
          else
            echo "No existing snapshot release found."
          fi
      - name: Check snapshot file
        id: snapshot
        run: |
          if [ -f prepared-articles.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update article snapshot (single/batch)
        if: ${{ (github.event.client_payload.collection || inputs.collection) == 'articles' && steps.snapshot.outputs.exists == 'true' && github.event.client_payload.forceFullRefresh != true }}
        run: node scripts/update-prepared-articles-batch.mjs
        env:
          PAYLOAD_API_URL: https://admin.lacuisinedebernard.com/api
          PAYLOAD_API_TOKEN: ${{ secrets.PAYLOAD_API_TOKEN }}
          ARTICLE_IDS_JSON: ${{ toJson(github.event.client_payload.articleIds) }}
          ARTICLE_SLUGS_JSON: ${{ toJson(github.event.client_payload.articleSlugs) }}
          ARTICLE_DELETE_IDS_JSON: ${{ toJson(github.event.client_payload.articleDeleteIds) }}
          ARTICLE_DELETE_SLUGS_JSON: ${{ toJson(github.event.client_payload.articleDeleteSlugs) }}
          SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
          ID: ${{ github.event.client_payload.id || inputs.id }}

      - name: Refresh full snapshot for taxonomy/media updates
        if: ${{ (github.event.client_payload.collection || inputs.collection) != 'articles' || steps.snapshot.outputs.exists == 'false' || github.event.client_payload.forceFullRefresh == true }}
        run: node scripts/refresh-prepared-articles.mjs
        env:
          PAYLOAD_API_URL: https://admin.lacuisinedebernard.com/api
          PAYLOAD_API_TOKEN: ${{ secrets.PAYLOAD_API_TOKEN }}

      - name: Upload snapshot to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="prepared-snapshot"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Prepared Articles Snapshot" --notes "Automated snapshot"
          fi
          gh release upload "$TAG" prepared-articles.json --clobber
