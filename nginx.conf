server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:html)$ {
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # Astro static export: resolve folder routes to /path/index.html
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
